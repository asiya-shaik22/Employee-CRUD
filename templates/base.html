<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        {% block extra_css %}
            <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f2f5;
    }

    form {
        width: 50%;
        max-width: 600px;
        border: 1px solid #ddd;
        padding : 20px;
        background-color: white;

    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    td {
        padding: 10px;
        vertical-align: middle;
    }

    td:first-child {
        text-align: right;
        font-weight: bold;
        color: #333;
    }

    input[type="text"], input[type="number"], input[type="email"], input[type="date"], select, textarea {
        width: 100%;
        padding: 8px;
        margin: 4px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
    }

    input[type="submit"] {
        background-color: #007BFF;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        text-transform: uppercase;
    }

    input[type="submit"]:hover {
        background-color: #0056b3;
    }

    textarea {
        resize: vertical;
        height: 100px;
    }
</style>


        {% endblock %}
    </style>
</head>
<body>
    {% include 'adminnavbar.html' %}

    {% block content %}

    {% endblock %}


</body>
</html>
