<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}Employee Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ems-ink: #17233b;
            --ems-muted: #68758b;
            --ems-primary: #3157d5;
            --ems-surface: #ffffff;
            --ems-background: #f5f7fb;
            --ems-border: #e5eaf2;
        }

        body {
            min-height: 100vh;
            background: var(--ems-background);
            color: var(--ems-ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .app-navbar {
            background: var(--ems-surface);
            border-bottom: 1px solid var(--ems-border);
        }

        .brand-mark {
            display: inline-grid;
            width: 2.25rem;
            height: 2.25rem;
            place-items: center;
            border-radius: .7rem;
            background: #eaf0ff;
            color: var(--ems-primary);
            font-weight: 800;
        }

        .navbar-brand,
        .navbar-brand:hover {
            color: var(--ems-ink);
        }

        .app-navbar .nav-link {
            color: #536078;
            font-weight: 600;
        }

        .app-navbar .nav-link:hover,
        .app-navbar .nav-link.active {
            color: var(--ems-primary);
        }

        .page-shell {
            width: min(100% - 2rem, 1200px);
            margin: 2.5rem auto 4rem;
        }

        .page-heading {
            margin-bottom: 1.5rem;
        }

        .page-heading h1 {
            margin-bottom: .4rem;
            font-size: clamp(1.75rem, 3vw, 2.25rem);
            font-weight: 750;
            letter-spacing: -.04em;
        }

        .page-heading p,
        .text-muted-custom {
            color: var(--ems-muted);
        }

        .surface-card {
            border: 1px solid var(--ems-border);
            border-radius: 1rem;
            background: var(--ems-surface);
            box-shadow: 0 8px 30px rgba(26, 43, 77, .045);
        }

        .form-label {
            color: #35425a;
            font-size: .9rem;
            font-weight: 650;
        }

        .form-control,
        .form-select {
            min-height: 2.8rem;
            border-color: #dce3ee;
            border-radius: .65rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #8aa2f4;
            box-shadow: 0 0 0 .2rem rgba(49, 87, 213, .12);
        }

        .btn-primary {
            --bs-btn-bg: var(--ems-primary);
            --bs-btn-border-color: var(--ems-primary);
            --bs-btn-hover-bg: #2748bb;
            --bs-btn-hover-border-color: #2748bb;
        }

        .table > :not(caption) > * > * {
            padding: .9rem 1rem;
            vertical-align: middle;
            border-color: var(--ems-border);
        }

        .table thead th {
            color: #65718a;
            background: #f8faff;
            font-size: .75rem;
            font-weight: 750;
            letter-spacing: .06em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .app-footer {
            color: #8490a4;
            font-size: .85rem;
        }

        @media (max-width: 575.98px) {
            .page-shell {
                width: min(100% - 1.25rem, 1200px);
                margin-top: 1.5rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'adminnavbar.html' %}

    <main class="page-shell">
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}

        <footer class="app-footer mt-5 text-center">
            Employee Management System
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
