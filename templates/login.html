<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f5f7fb; color: #17233b; }
        .auth-card { width: min(100%, 460px); border: 1px solid #e5eaf2; border-radius: 1rem; box-shadow: 0 16px 48px rgba(26, 43, 77, .08); }
        .brand-mark { display: inline-grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: .75rem; background: #eaf0ff; color: #3157d5; font-weight: 800; }
        .form-control { min-height: 2.9rem; border-color: #dce3ee; border-radius: .65rem; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <main class="container">
        <div class="auth-card mx-auto bg-white p-4 p-md-5">
            <a href="{% url 'log' %}" class="d-flex align-items-center gap-2 mb-4 text-decoration-none text-dark fw-bold">
                <span class="brand-mark" aria-hidden="true">E</span>
                <span>Employee Management</span>
            </a>
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">Sign in to manage your employee records.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="txtname" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="txtpswd" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">
                New here? <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none">Create an account</a>
            </p>
        </div>
        <p class="small text-center text-secondary mt-4 mb-0">Employee Management System</p>
    </main>
</body>
</html>
