<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f5f7fb; color: #17233b; }
        .auth-card { width: min(100%, 500px); border: 1px solid #e5eaf2; border-radius: 1rem; box-shadow: 0 16px 48px rgba(26, 43, 77, .08); }
        .brand-mark { display: inline-grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: .75rem; background: #eaf0ff; color: #3157d5; font-weight: 800; }
        .form-control { min-height: 2.9rem; border-color: #dce3ee; border-radius: .65rem; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <main class="container">
        <div class="auth-card mx-auto bg-white p-4 p-md-5">
            <a href="{% url 'log' %}" class="d-flex align-items-center gap-2 mb-4 text-decoration-none text-dark fw-bold">
                <span class="brand-mark" aria-hidden="true">E</span>
                <span>Employee Management</span>
            </a>
            <h1 class="h3 fw-bold mb-2">Create your account</h1>
            <p class="text-secondary mb-4">Get started managing employee information.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="full-name">Username</label>
                    <input class="form-control" type="text" id="full-name" name="txtname1" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="email">Email address</label>
                    <input class="form-control" type="email" id="email" name="txtmail1" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="new-password">Password</label>
                    <input class="form-control" type="password" id="new-password" name="txtpswd1" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" for="confirm-password">Confirm password</label>
                    <input class="form-control" type="password" id="confirm-password" name="txtpswd2" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">Create account</button>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">
                Already registered? <a href="{% url 'log' %}" class="fw-semibold text-decoration-none">Sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
